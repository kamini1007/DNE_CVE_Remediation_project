# Annotated with the IRSA role ARN from Terraform output `ai_analysis_irsa_role_arn`.
# Fill in <AI_ANALYSIS_IRSA_ROLE_ARN> after `terraform apply` (or template it in CI).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-analysis-service
  namespace: cve-platform
  annotations:
    eks.amazonaws.com/role-arn: "<AI_ANALYSIS_IRSA_ROLE_ARN>"
