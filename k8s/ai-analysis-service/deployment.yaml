apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analysis-service
  namespace: cve-platform
  labels:
    app: ai-analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-analysis-service
  template:
    metadata:
      labels:
        app: ai-analysis-service
    spec:
      # IRSA: this ServiceAccount is annotated (see serviceaccount.yaml) with the
      # Terraform-created IAM role that grants bedrock:InvokeModel - no AWS
      # access keys are set anywhere in this manifest.
      serviceAccountName: ai-analysis-service
      # UID 1000 is the `node` user baked into the node:20-alpine image, which
      # the Dockerfile already switches to via USER node.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-analysis-service
          # CI overwrites this tag on each deploy via `kubectl set image`.
          image: <ECR_REGISTRY>/cve-remediation/ai-analysis-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ai-analysis-config
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
