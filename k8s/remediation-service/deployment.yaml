apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-service
  namespace: cve-platform
  labels:
    app: remediation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remediation-service
  template:
    metadata:
      labels:
        app: remediation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediation-service
          image: <ECR_REGISTRY>/cve-remediation/remediation-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: remediation-config
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            # Jira is optional - if these come back empty (secret left blank in
            # Secrets Manager), config.jira.isConfigured is false and the
            # service runs in dry-run mode automatically.
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: baseUrl
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: apiToken
            - name: JIRA_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: projectKey
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
