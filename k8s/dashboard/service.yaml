apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: cve-platform
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8080
  # ClusterIP: external access comes through the ALB Ingress
  # (k8s/base/ingress.yaml), not directly to this Service.
  type: ClusterIP
