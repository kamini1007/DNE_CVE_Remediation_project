# Requires the External Secrets Operator (ESO) installed on the cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# ESO's IRSA role needs secretsmanager:GetSecretValue on the secrets below -
# add that as a follow-up Terraform IAM policy once ESO is installed.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: cve-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: cve-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials
  data:
    - secretKey: host
      remoteRef:
        key: cve-remediation/dev/db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: cve-remediation/dev/db-credentials
        property: port
    - secretKey: dbname
      remoteRef:
        key: cve-remediation/dev/db-credentials
        property: dbname
    - secretKey: username
      remoteRef:
        key: cve-remediation/dev/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: cve-remediation/dev/db-credentials
        property: password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nvd-api-key
  namespace: cve-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: nvd-api-key
  data:
    - secretKey: apiKey
      remoteRef:
        key: cve-remediation/dev/nvd-api-key
        property: apiKey

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jira-credentials
  namespace: cve-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: jira-credentials
  data:
    - secretKey: baseUrl
      remoteRef:
        key: cve-remediation/dev/jira-credentials
        property: baseUrl
    - secretKey: email
      remoteRef:
        key: cve-remediation/dev/jira-credentials
        property: email
    - secretKey: apiToken
      remoteRef:
        key: cve-remediation/dev/jira-credentials
        property: apiToken
    - secretKey: projectKey
      remoteRef:
        key: cve-remediation/dev/jira-credentials
        property: projectKey
