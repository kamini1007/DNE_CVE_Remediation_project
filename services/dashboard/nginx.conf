server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user that
    # can't bind privileged ports.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probe target - must not fall through to the SPA index.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP"}';
    }

    # SPA routing: unknown paths serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
