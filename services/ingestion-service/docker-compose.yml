version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cve_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cve_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cve-ingestion-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cve_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NVD_API_KEY: "${NVD_API_KEY:-}"
    ports:
      - "8080:8080"

volumes:
  cve_pg_data:
